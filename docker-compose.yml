services:
  db:
    image: postgres:16-alpine
    container_name: stock-research-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_research_db
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5432:5432"
    volumes:
      - stock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_research_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  stock_pgdata:
