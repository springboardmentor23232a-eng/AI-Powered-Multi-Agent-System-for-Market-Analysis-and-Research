# Runs automatically on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockapp
          POSTGRES_PASSWORD: stockapp
          POSTGRES_DB: stock_research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockapp" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://stockapp:stockapp@localhost:5432/stock_research_test
      TEST_DATABASE_URL: postgresql+psycopg://stockapp:stockapp@localhost:5432/stock_research_test
      JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Check database migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Run tests on SQLite
        run: TEST_DATABASE_URL=sqlite:// pytest
      - name: Run tests on PostgreSQL
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
